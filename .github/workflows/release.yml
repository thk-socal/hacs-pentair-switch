name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version number
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("custom_components/pentair_cloud/manifest.json")
          data = json.loads(path.read_text())
          data["version"] = "${{ github.event.release.tag_name }}"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: ZIP integration directory
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/pentair_cloud"
          zip -r "${{ github.workspace }}/pentair_cloud.zip" ./
          ls -lh "${{ github.workspace }}/pentair_cloud.zip"

      - name: Upload ZIP file to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ github.workspace }}/pentair_cloud.zip
